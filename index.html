<script>
/* ===== 버전 단일 출처 =====
   여기만 고치면 update.js 의 APPV 가 따라옵니다.
   배포 시 bump.py 를 쓰면 index.html 의 ?v= 와 sw.js 의 VER 까지 한 번에 맞춰집니다. */
window.APPV='70';

/* ===== 전역 오류 핸들러 =====
   스크립트 20개가 전역 스코프를 공유하므로, 한 곳에서 예외가 나면
   화면이 조용히 멈춥니다. 마지막 오류를 남겨 설정에서 확인할 수 있게 합니다. */
(function(){
 var shown=false;
 function keep(msg,src,ln,col){
  try{localStorage.setItem('b6.lasterr',JSON.stringify({
   m:String(msg||'').slice(0,300),s:String(src||'').split('/').pop(),
   l:ln||0,c:col||0,v:window.APPV,at:new Date().toISOString()}))}catch(e){}
 }
 function banner(){
  if(shown)return; shown=true;
  try{
   var d=document.createElement('div');
   d.setAttribute('style','position:fixed;left:0;right:0;bottom:0;z-index:99999;'+
    'background:#B3261E;color:#fff;font:13px/1.5 -apple-system,sans-serif;'+
    'padding:11px 14px;text-align:center');
   d.innerHTML='문제가 생겨 일부 화면이 멈췄어요. '+
    '<b style="text-decoration:underline">새로고침</b> · '+
    '<span style="opacity:.8">기록은 지워지지 않습니다</span>';
   d.onclick=function(){location.reload()};
   (document.body||document.documentElement).appendChild(d);
  }catch(e){}
 }
 window.addEventListener('error',function(e){
  if(e&&e.target&&e.target.tagName==='SCRIPT'){keep('script load fail',e.target.src,0,0);banner();return}
  keep(e&&e.message,e&&e.filename,e&&e.lineno,e&&e.colno);banner();
 });
 window.addEventListener('unhandledrejection',function(e){
  var r=e&&e.reason;
  keep((r&&(r.message||r))||'unhandled rejection','promise',0,0);banner();
 });
})();
</script>

<script>
/* 시트 아래로 스와이프해서 닫기 */
(function(){var md=document.getElementById('md'),sh=document.getElementById('sh');
if(!md||!sh)return;
var y0=null,dy=0,drag=false,fromTop=false;
function body(){return document.getElementById('mb')}
function start(y,tgt){
 var gb=document.getElementById('gb');
 fromTop=(gb&&(tgt===gb||gb.contains(tgt)));
 /* 핸들이 아니면, 시트가 맨 위로 스크롤된 상태에서만 끌어내리기 허용 */
 if(!fromTop&&sh.scrollTop>2)return;
 y0=y;dy=0;drag=true;sh.classList.add('drag');sh.classList.remove('snap')}
function move(y,ev){if(!drag||y0===null)return;
 var d=y-y0;
 if(d<0)d=0;   /* 위로는 이동하지 않는다 — 시트 위쪽에 회색 배경이 드러나는 원인 */
 if(d>0&&!fromTop&&sh.scrollTop>2){end();return}
 dy=d;
 if(d>0&&ev&&ev.cancelable)ev.preventDefault();
 sh.style.transform='translateY('+Math.max(0,d)+'px)';
 md.style.background='rgba(50,40,35,'+Math.max(.12,.5-d/700)+')'}
function reset(){sh.style.transform='';sh.style.background='';
 sh.style.removeProperty('transform');md.style.removeProperty('background');
 sh.classList.remove('drag');sh.classList.remove('snap');y0=null;dy=0;drag=false;
 requestAnimationFrame(function(){sh.style.removeProperty('transform');md.style.removeProperty('background')})}
window.shReset=reset;
function end(){if(!drag)return;drag=false;sh.classList.remove('drag');sh.classList.add('snap');
 var h=sh.getBoundingClientRect().height||600;
 if(dy>Math.min(150,h*0.28)){
   sh.style.transform='translateY(100%)';md.style.background='rgba(50,40,35,0)';
   setTimeout(function(){closeM();reset()},190)}
 else{sh.style.transform='';md.style.background='';
   setTimeout(function(){sh.classList.remove('snap')},240)}
 y0=null;dy=0}
sh.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;start(e.touches[0].clientY,e.target)},{passive:true});
sh.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;move(e.touches[0].clientY,e)},{passive:false});
sh.addEventListener('touchend',end);
sh.addEventListener('touchcancel',end);
/* 데스크톱: 핸들 드래그 */
var gb=document.getElementById('gb');
if(gb){gb.addEventListener('mousedown',function(e){start(e.clientY,gb);e.preventDefault()});
document.addEventListener('mousemove',function(e){if(drag)move(e.clientY,null)});
document.addEventListener('mouseup',end)}
/* ESC 로도 닫기 */
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&md.classList.contains('on'))closeM()});
})();
</script>
</body></html>
